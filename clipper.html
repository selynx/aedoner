<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aedoner // Gyújtók</title>
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: #f1f0ec;
            color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            padding: 40px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.15s ease, filter 0.15s ease;
        }

        #app-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* GLITCH / MATRIX NÉZET STÍLUSA */
        body.glitch-mode {
            background-color: #050a05 !important;
            color: #00ff66 !important;
            filter: contrast(150%) hue-rotate(90deg);
        }

        body.glitch-mode header, 
        body.glitch-mode footer,
        body.glitch-mode .modal-card,
        body.glitch-mode .cassette-player {
            background-color: #000 !important;
            color: #00ff66 !important;
            border-color: #00ff66 !important;
        }

        body.glitch-mode .modal-meta-title,
        body.glitch-mode .back-link,
        body.glitch-mode .clipper-label,
        body.glitch-mode .zippo-label {
            color: #00ff66 !important;
            opacity: 1 !important;
        }

        body.glitch-mode .zippo-shelf {
            border-bottom-color: #00ff66 !important;
        }

        body.glitch-mode .close-modal {
            background-color: #000 !important;
            color: #00ff66 !important;
            border-color: #00ff66 !important;
            box-shadow: 4px 4px 0px #00ff66 !important;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.04;
            pointer-events: none;
            z-index: 999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 4px solid #1a1a1a;
            padding-bottom: 20px;
            margin-bottom: 60px;
            width: 100%;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-link {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            font-weight: 900;
        }

        .view-section {
            display: none;
            width: 100%;
        }
        .view-section.active-view {
            display: block;
        }

        /* ZIPPO INDÍTÓ KAPU */
        .zippo-trigger-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 1px dashed #1a1a1a;
        }

        .zippo-trigger-text {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .zippo-lighter {
            width: 84px;
            height: 124px;
            position: relative;
            cursor: pointer;
            filter: drop-shadow(6px 8px 0px rgba(26,26,26,0.2));
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: rotate(-1deg);
        }
        .zippo-lighter:hover {
            transform: scale(1.05) rotate(1deg);
        }

        .zippo-body {
            position: absolute;
            bottom: 0; left: 0; width: 84px; height: 72px;
            background: linear-gradient(135deg, #3a3a3a 0%, #242424 50%, #1c1c1c 100%);
            border: 3px solid #1a1a1a;
            border-radius: 0 0 6px 6px;
        }

        .zippo-lid {
            position: absolute;
            top: 13px; left: 0; width: 84px; height: 42px;
            background: linear-gradient(135deg, #444 0%, #2d2d2d 50%, #202020 100%);
            border: 3px solid #1a1a1a;
            border-radius: 6px 6px 0 0;
            transform-origin: left bottom;
            transition: transform 0.15s steps(1);
        }

        .zippo-chimney {
            position: absolute;
            top: 25px; left: 26px; width: 32px; height: 32px;
            background: linear-gradient(90deg, #8a8980 0%, #b5b3a8 50%, #6e6d65 100%);
            border: 2px solid #1a1a1a;
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            opacity: 0;
        }

        .zippo-flame {
            position: absolute;
            top: -24px; left: 32px; width: 20px; height: 55px;
            background: #d96b52;
            clip-path: polygon(50% 0%, 100% 65%, 80% 100%, 20% 100%, 0% 65%);
            opacity: 0;
            transform-origin: bottom center;
        }

        .zippo-lighter.open-1 .zippo-lid { transform: rotate(-50deg) translateY(4px); }
        .zippo-lighter.open-1 .zippo-chimney { opacity: 1; }
        .zippo-lighter.open-2 .zippo-lid { transform: rotate(-130deg) translateX(-6px); }
        .zippo-lighter.open-2 .zippo-flame { opacity: 1; transform: scaleY(1.25) rotate(2deg); background: #e5b869; }
        .zippo-lighter.open-3 .zippo-flame { opacity: 1; transform: scaleY(1) rotate(-1deg); background: #d96b52; }

        /* CLIPPER RÁCS */
        .clipper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 50px 35px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .clipper-item {
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(4px 6px 0px rgba(26, 26, 26, 0.06));
            transition: filter 0.3s, transform 0.4s cubic-bezier(0.25, 1, 0.3, 1);
        }

        .clipper-image-holder {
            width: 100%;
            height: 240px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clipper-image-holder img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .clipper-label {
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 1px;
            opacity: 0.4;
            transition: all 0.3s;
        }

        .clipper-item:hover {
            transform: scale(1.1) rotate(0deg) translateY(-8px) !important;
            filter: drop-shadow(10px 15px 0px rgba(74, 107, 130, 0.12));
            z-index: 10;
        }
        .clipper-item:hover .clipper-label { opacity: 1; color: #4a6b82; }

        /* ZIPPO POLCRENDSZER */
        .zippo-cabinet {
            width: 100%;
            max-width: 1300px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 90px;
            padding: 20px;
        }

        .zippo-shelf {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            padding-bottom: 30px;
            position: relative;
            align-items: flex-end;
        }

        #shelf-1 { border-bottom: 8px solid #4a6b82; clip-path: polygon(0 0, 100% 1.5%, 100% 100%, 0 100%); }
        #shelf-2 { border-bottom: 8px solid #d96b52; clip-path: polygon(0 1.5%, 100% 0%, 100% 100%, 0 100%); transform: rotate(-0.2deg); }
        #shelf-3 { border-bottom: 8px solid #e5b869; clip-path: polygon(0 0, 100% 1%, 100% 100%, 0 100%); }

        .zippo-shelf::after {
            content: ""; position: absolute; bottom: -14px; left: 0; width: 100%; height: 6px;
            background-color: rgba(26, 26, 26, 0.15);
        }

        .zippo-item {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 190px;
            filter: drop-shadow(6px 10px 0px rgba(26, 26, 26, 0.15));
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.3, 1), filter 0.3s;
        }

        .zippo-img-holder {
            width: 105px;
            aspect-ratio: 1 / 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .zippo-img-holder img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .zippo-label {
            font-size: 0.75rem; 
            font-weight: bold; 
            margin-top: 12px;
            letter-spacing: 0.5px; 
            opacity: 0.4; 
            text-transform: uppercase;
        }

        .zippo-item:hover {
            transform: scale(1.15) rotate(0deg) translateY(-12px) !important;
            filter: drop-shadow(14px 20px 0px rgba(217, 107, 82, 0.25));
            z-index: 10;
        }
        .zippo-item:hover .zippo-label { opacity: 1; color: #d96b52; }

        /* KISEBB, KOMPAKT ÉS KÖZÉPRE IGAZÍTOTT MODAL CSOMAG */
        .clipper-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(241, 240, 236, 0.95);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .clipper-modal.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background-color: transparent; 
            border: none;
            width: 90vw;
            max-width: 500px; 
            height: 60vh;
            display: flex; 
            justify-content: center;
            align-items: center;
            position: relative; 
            box-shadow: none;
        }

        .close-modal {
            position: absolute; 
            top: -20px; 
            right: 0px;
            background-color: #d96b52; 
            color: #fff; 
            border: 3px solid #1a1a1a;
            font-family: monospace; 
            font-weight: bold; 
            padding: 8px 14px; 
            cursor: pointer;
            box-shadow: 4px 4px 0px #1a1a1a;
            font-size: 0.85rem;
            z-index: 30;
        }

        .modal-image-wrapper { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .modal-image-wrapper img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            filter: drop-shadow(8px 12px 0px rgba(26,26,26,0.15));
        }

        /* LÁBLÉC ÉS KAZETTÁS LEJÁTSZÓ */
        footer {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; text-transform: uppercase; font-weight: bold;
            border-top: 2px solid #1a1a1a; padding-top: 15px; margin-top: auto;
            max-width: 1600px; margin-left: auto; margin-right: auto;
            gap: 15px; flex-wrap: wrap;
        }

        .cassette-player {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.05);
            padding: 4px 10px;
            border: 1px solid #1a1a1a;
        }

        .cassette-btn {
            background: transparent;
            border: none;
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
            color: inherit;
        }

        .cassette-btn:hover {
            color: #d96b52;
        }
    </style>
</head>
<body ondblclick="toggleGlitch()">

    <div id="app-wrapper">
        <header>
            <a href="index.html" class="back-link" id="header-back-btn">← [ vissza ]</a>
            <h1 id="header-title">03 // Gyújtók</h1>
        </header>

        <div class="zippo-trigger-wrapper" id="zippo-gate">
            <div class="zippo-trigger-text" id="gate-text">Kattints a Zippóra a B-oldalhoz</div>
            <div class="zippo-lighter" id="interactive-zippo">
                <div class="zippo-chimney"></div>
                <div class="zippo-flame"></div>
                <div class="zippo-lid"></div>
                <div class="zippo-body"></div>
            </div>
        </div>

        <!-- A-OLDAL: CLIPPER SZEGMENS -->
        <div class="view-section active-view" id="clipper-section">
            <main class="clipper-grid" id="clipper-grid-container"></main>
        </div>

        <!-- B-OLDAL: ZIPPO SZEGMENS -->
        <div class="view-section" id="zippo-section">
            <div class="zippo-cabinet">
                <div class="zippo-shelf" id="shelf-1"></div>
                <div class="zippo-shelf" id="shelf-2"></div>
                <div class="zippo-shelf" id="shelf-3"></div>
            </div>
        </div>
    </div>

    <!-- MODÁLIS PANEL (CSAK KÉP) -->
    <div class="clipper-modal" id="info-modal">
        <div class="modal-card">
            <button class="close-modal" id="close-btn">X [ BEZÁR ]</button>
            <div class="modal-image-wrapper">
                <img src="" id="modal-img" alt="Zippo fókusz">
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-left" id="footer-left-text">
            // Nem dohányzom...
        </div>

        <!-- STICKY KAZETTÁS LEJÁTSZÓ -->
        <div class="cassette-player">
            <button class="cassette-btn" id="playBtn" onclick="toggleAudio()">[ ▶ PLAY ]</button>
            <span id="trackName" style="font-size:0.7rem;">[ Random song ]</span>
            <audio id="audioEngine" loop></audio>
        </div>

        <div class="footer-right" id="timer">Jelenlét: 0 másodperc</div>
    </footer>

    <script>
        const realClipperData = [
            { id: 1, file: "IMG_2017.png" },
            { id: 2, file: "IMG_2031.png" },
            { id: 3, file: "IMG_2033.png" },
            { id: 4, file: "IMG_2038.png" }, 
            { id: 5, file: "IMG_2040.png" },
            { id: 6, file: "IMG_2043.png" },
            { id: 7, file: "IMG_2045.png" },
            { id: 8, file: "IMG_2047.png" },
            { id: 9, file: "IMG_2049.png" },
            { id: 10, file: "IMG_2053.png" },
            { id: 11, file: "IMG_2055.png" },
            { id: 12, file: "IMG_2057.png" },
            { id: 13, file: "IMG_2059.png" },
            { id: 14, file: "IMG_2062.png" },
            { id: 15, file: "IMG_2063.png" },
            { id: 16, file: "IMG_2065.png" },
            { id: 17, file: "IMG_2067.png" },
            { id: 18, file: "IMG_2069.png" },
            { id: 19, file: "IMG_2071.png" },
            { id: 20, file: "IMG_2073.png" },
            { id: 21, file: "IMG_2075.png" },
            { id: 22, file: "IMG_2077.png" },
            { id: 23, file: "IMG_2079.png" },
            { id: 24, file: "IMG_2081.png" },
            { id: 25, file: "IMG_2083.png" },
            { id: 26, file: "IMG_2087.png" },
            { id: 27, file: "IMG_2089.png" },
            { id: 28, file: "IMG_2091.png" },
            { id: 29, file: "IMG_2093.png" },
            { id: 30, file: "IMG_2096.png" },
            { id: 31, file: "IMG_2098.png" },
            { id: 32, file: "IMG_2100.png" },
            { id: 33, file: "IMG_2104.png" },
            { id: 34, file: "IMG_2106.png" },
            { id: 35, file: "IMG_2108.png" },
            { id: 36, file: "IMG_2110.png" },
            { id: 37, file: "IMG_2112.png" },
            { id: 38, file: "IMG_2114.png" },
            { id: 39, file: "IMG_2116.png" },
            { id: 40, file: "IMG_2119.png" },
            { id: 41, file: "IMG_2122.png" },
            { id: 42, file: "IMG_2124.png" },
            { id: 43, file: "IMG_2128.png" },
            { id: 44, file: "IMG_2130.png" },
            { id: 45, file: "IMG_2132.png" },
            { id: 46, file: "IMG_2135.png" }, 
            { id: 47, file: "IMG_2137.png" },
            { id: 48, file: "IMG_2139.png" },
            { id: 49, file: "IMG_2141.png" },
            { id: 50, file: "IMG_2143.png" },
            { id: 51, file: "IMG_2145.png" },
            { id: 52, file: "IMG_2147.png" },
            { id: 53, file: "IMG_2149.png" },
            { id: 54, file: "IMG_2151.png" },
            { id: 55, file: "IMG_2153.png" },
            { id: 56, file: "IMG_2155.png" },
            { id: 57, file: "IMG_2157.png" },
            { id: 58, file: "IMG_2159.png" },
            { id: 59, file: "IMG_2161.png" },
            { id: 60, file: "IMG_2163.png" },
            { id: 61, file: "IMG_2165.png" },
            { id: 62, file: "IMG_2167.png" },
            { id: 63, file: "IMG_2169.png" },
            { id: 64, file: "IMG_2171.png" },
            { id: 65, file: "IMG_2173.png" }
        ];

        const clipperGrid = document.getElementById('clipper-grid-container');
        const modal = document.getElementById('info-modal');
        const closeModal = document.getElementById('close-btn');
        const modalImg = document.getElementById('modal-img');

        if (clipperGrid) {
            for (let i = 1; i <= 65; i++) {
                const currentId = i < 10 ? "0" + i : i;
                const match = realClipperData.find(item => item.id === i);
                
                const itemImg = match ? match.file : `https://via.placeholder.com/120x336/dca2a6/1a1a1a?text=C_${currentId}`;

                const card = document.createElement('div');
                card.className = 'clipper-item';
                
                const randomRotate = (Math.random() * 12 - 6).toFixed(2);
                const randomY = (Math.random() * 10 - 5).toFixed(2);
                card.style.transform = `rotate(${randomRotate}deg) translateY(${randomY}px)`;

                card.innerHTML = `
                    <div class="clipper-image-holder">
                        <img src="${itemImg}" alt="Clipper #${currentId}">
                    </div>
                    <div class="clipper-label">#${currentId}</div>
                `;
                
                card.addEventListener('click', () => {
                    modalImg.src = itemImg;
                    modal.classList.add('active');
                });
                clipperGrid.appendChild(card);
            }
        }

        // ZIPPO POLCOK
        for(let i = 1; i <= 15; i++) {
            let id = i < 10 ? "0" + i : i;
            let targetShelf = i <= 5 ? document.getElementById('shelf-1') : (i <= 10 ? document.getElementById('shelf-2') : document.getElementById('shelf-3'));
            
            if (targetShelf) {
                const zItem = document.createElement('div');
                zItem.className = 'zippo-item';
                
                const randomRotate = (Math.random() * 6 - 3).toFixed(2);
                zItem.style.transform = `rotate(${randomRotate}deg)`;

                zItem.innerHTML = `
                    <div class="zippo-img-holder">
                        <img src="zippo_${id}.png" alt="Zippo #${id}">
                    </div>
                    <div class="zippo-label">#z_${id}</div>
                `;
                
                zItem.addEventListener('click', () => {
                    modalImg.src = `zippo_${id}o.png`;
                    modal.classList.add('active');
                });
                targetShelf.appendChild(zItem);
            }
        }

        /* FOLYAMATOS JELENLÉT MÉRŐ */
        let seconds = sessionStorage.getItem('aedoner_presence');
        if (seconds === null) {
            seconds = 0;
        } else {
            seconds = parseInt(seconds, 10);
        }

        setInterval(() => {
            seconds++;
            sessionStorage.setItem('aedoner_presence', seconds);
            const timerEl = document.getElementById('timer');
            if (timerEl) {
                timerEl.innerText = "Jelenlét: " + seconds + " másodperc";
            }
        }, 1000);

        document.getElementById('timer').innerText = "Jelenlét: " + seconds + " másodperc";

        const zippoKey = document.getElementById('interactive-zippo');
        const clipperSection = document.getElementById('clipper-section');
        const zippoSection = document.getElementById('zippo-section');
        const headerTitle = document.getElementById('header-title');
        const footerLeft = document.getElementById('footer-left-text');
        const gateText = document.getElementById('gate-text');
        const headerBackBtn = document.getElementById('header-back-btn');

        let isZippoView = false;

        if (zippoKey) {
            zippoKey.addEventListener('click', () => {
                if (isZippoView) return;
                isZippoView = true;
                gateText.innerText = "LOBBANÁS...";

                setTimeout(() => { zippoKey.classList.add('open-1'); }, 100);
                setTimeout(() => { zippoKey.classList.add('open-2'); }, 450);
                setTimeout(() => { zippoKey.classList.add('open-3'); }, 750);

                setTimeout(() => {
                    clipperSection.classList.remove('active-view');
                    zippoSection.classList.add('active-view');
                    headerTitle.innerText = "04 // Zippo Archívum";
                    footerLeft.innerText = "// Még mindig nem...";
                    zippoKey.className = "zippo-lighter";
                    document.getElementById('zippo-gate').style.display = 'none';
                    headerBackBtn.href = "#";
                    headerBackBtn.innerText = "← [ clipperek ]";
                }, 1500);
            });
        }

        if (headerBackBtn) {
            headerBackBtn.addEventListener('click', (e) => {
                if (isZippoView) {
                    e.preventDefault();
                    isZippoView = false;
                    zippoSection.classList.remove('active-view');
                    clipperSection.classList.add('active-view');
                    headerTitle.innerText = "03 // Gyújtók";
                    footerLeft.innerText = "// Nem dohányzom...";
                    document.getElementById('zippo-gate').style.display = 'flex';
                    gateText.innerText = "Kattints a Zippóra a B-oldalhoz";
                    headerBackBtn.href = "index.html";
                    headerBackBtn.innerText = "← [ vissza ]";
                }
            });
        }

        if (closeModal) closeModal.addEventListener('click', () => modal.classList.remove('active'));
        if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        /* KAZETTÁS MAGNÓ RANDOM ENGINE */
        const audio = document.getElementById('audioEngine') || document.createElement('audio');
        if (!audio.id) { audio.id = 'audioEngine'; audio.loop = true; document.body.appendChild(audio); }

        const playBtn = document.getElementById('playBtn');
        const trackNameEl = document.getElementById('trackName');

        const playlist = [
            { title: "hegyek.mp3", src: "Dallamok/hegyek.mp3" },
            { title: "A_babam_fekete_romalany.wav", src: "Dallamok/A_babam_fekete_romalany.wav" },
            { title: "littlepaul.wav", src: "Dallamok/littlepaul.wav" },
            { title: "makaralexneknagya.wav", src: "Dallamok/makaralexneknagya.wav" }
        ];

        function toggleAudio() {
            if (audio.paused) {
                if (!audio.src || audio.src === "" || audio.ended) {
                    const randomIndex = Math.floor(Math.random() * playlist.length);
                    const randomTrack = playlist[randomIndex];
                    audio.src = randomTrack.src;
                    if (trackNameEl) trackNameEl.innerText = randomTrack.title;
                }
                
                audio.play();
                playBtn.innerText = '[ ❚❚ PAUSE ]';
            } else {
                audio.pause();
                playBtn.innerText = '[ ▶ PLAY ]';
            }
        }

        function toggleGlitch() {
            document.body.classList.toggle('glitch-mode');
        }

        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleGlitch();
            }
        });
    </script>
</body>
</html>
