<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aedoner // Gyújtók</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }

        body {
            background-color: #f1f0ec;
            color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            padding: 40px;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
            transition: background-color 0.15s ease, filter 0.15s ease;
        }

        #app-wrapper { width: 100%; display: flex; flex-direction: column; flex: 1; }

        /* GLITCH / MATRIX NÉZET STÍLUSA */
        body.glitch-mode {
            background-color: #050a05 !important;
            color: #00ff66 !important;
            filter: contrast(150%) hue-rotate(90deg);
        }

        body.glitch-mode header,
        body.glitch-mode footer,
        body.glitch-mode .modal-card,
        body.glitch-mode .cassette-player {
            background-color: #000 !important;
            color: #00ff66 !important;
            border-color: #00ff66 !important;
        }

        body.glitch-mode .modal-meta-title,
        body.glitch-mode .back-link,
        body.glitch-mode .clipper-label,
        body.glitch-mode .zippo-label {
            color: #00ff66 !important;
            opacity: 1 !important;
        }

        body.glitch-mode .zippo-shelf { border-bottom-color: #00ff66 !important; }

        body.glitch-mode .close-modal {
            background-color: #000 !important;
            color: #00ff66 !important;
            border-color: #00ff66 !important;
            box-shadow: 4px 4px 0px #00ff66 !important;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.04;
            pointer-events: none;
            z-index: 999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 4px solid #1a1a1a;
            padding-bottom: 20px;
            margin-bottom: 60px;
            width: 100%;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-link {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        .back-link:hover { text-decoration: underline; }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            font-weight: 900;
        }

        .view-section { display: none; width: 100%; }
        .view-section.active-view { display: block; }

        /* ZIPPO INDÍTÓ KAPU */
        .zippo-trigger-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 1px dashed #1a1a1a;
        }

        .zippo-trigger-text {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .zippo-lighter {
            width: 84px;
            height: 124px;
            position: relative;
            cursor: pointer;
            filter: drop-shadow(6px 8px 0px rgba(26,26,26,0.2));
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: rotate(-1deg);
        }
        .zippo-lighter:hover { transform: scale(1.05) rotate(1deg); }

        .zippo-body {
            position: absolute;
            bottom: 0; left: 0; width: 84px; height: 72px;
            background: linear-gradient(135deg, #3a3a3a 0%, #242424 50%, #1c1c1c 100%);
            border: 3px solid #1a1a1a;
            border-radius: 0 0 6px 6px;
        }

        .zippo-lid {
            position: absolute;
            top: 13px; left: 0; width: 84px; height: 42px;
            background: linear-gradient(135deg, #444 0%, #2d2d2d 50%, #202020 100%);
            border: 3px solid #1a1a1a;
            border-radius: 6px 6px 0 0;
            transform-origin: left bottom;
            transition: transform 0.15s steps(1);
        }

        .zippo-chimney {
            position: absolute;
            top: 25px; left: 26px; width: 32px; height: 32px;
            background: linear-gradient(90deg, #8a8980 0%, #b5b3a8 50%, #6e6d65 100%);
            border: 2px solid #1a1a1a;
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            opacity: 0;
        }

        .zippo-flame {
            position: absolute;
            top: -24px; left: 32px; width: 20px; height: 55px;
            background: #d96b52;
            clip-path: polygon(50% 0%, 100% 65%, 80% 100%, 20% 100%, 0% 65%);
            opacity: 0;
            transform-origin: bottom center;
        }

        .zippo-lighter.open-1 .zippo-lid { transform: rotate(-50deg) translateY(4px); }
        .zippo-lighter.open-1 .zippo-chimney { opacity: 1; }
        .zippo-lighter.open-2 .zippo-lid { transform: rotate(-130deg) translateX(-6px); }
        .zippo-lighter.open-2 .zippo-flame { opacity: 1; transform: scaleY(1.25) rotate(2deg); background: #e5b869; }
        .zippo-lighter.open-3 .zippo-flame { opacity: 1; transform: scaleY(1) rotate(-1deg); background: #d96b52; }

        /* CLIPPER RÁCS */
        .clipper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 50px 35px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .clipper-item {
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(4px 6px 0px rgba(26, 26, 26, 0.06));
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .clipper-image-holder {
            width: 100%;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clipper-image-holder img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .clipper-label {
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 1px;
            opacity: 0.4;
            transition: all 0.3s;
        }

        /* hover csak egérrel (a .can-hover osztályt a script teszi rá) */
        .can-hover .clipper-item:hover {
            transform: scale(1.1) rotate(0deg) translateY(-8px) !important;
            filter: drop-shadow(10px 15px 0px rgba(74, 107, 130, 0.12));
            z-index: 10;
        }
        .can-hover .clipper-item:hover .clipper-label { opacity: 1; color: #4a6b82; }

        /* ZIPPO POLCRENDSZER */
        .zippo-cabinet {
            width: 100%;
            max-width: 1300px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 90px;
            padding: 20px;
        }

        .zippo-shelf {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 25px;
            padding-bottom: 30px;
            position: relative;
            align-items: flex-end;
            width: 100%;
        }

        #shelf-1 { border-bottom: 8px solid #4a6b82; }
        #shelf-2 { border-bottom: 8px solid #d96b52; transform: rotate(-0.2deg); }
        #shelf-3 { border-bottom: 8px solid #e5b869; }

        .zippo-shelf::after {
            content: ""; position: absolute; bottom: -14px; left: 0; width: 100%; height: 6px;
            background-color: rgba(26, 26, 26, 0.15);
        }

        .zippo-item {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: auto;
            min-height: 250px;
            filter: drop-shadow(6px 10px 0px rgba(26, 26, 26, 0.15));
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.3, 1);
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .zippo-img-holder {
            width: 100%;
            max-width: 150px;
            aspect-ratio: 1 / 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .zippo-img-holder img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .zippo-label {
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 12px;
            letter-spacing: 0.5px;
            opacity: 0.4;
            text-transform: uppercase;
        }

        .can-hover .zippo-item:hover {
            transform: scale(1.15) rotate(0deg) translateY(-12px) !important;
            filter: drop-shadow(14px 20px 0px rgba(217, 107, 82, 0.25));
            z-index: 10;
        }
        .can-hover .zippo-item:hover .zippo-label { opacity: 1; color: #d96b52; }

        /* MODAL */
        .clipper-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw;
            height: 100vh; height: 100dvh;
            background-color: rgba(241, 240, 236, 0.95);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .clipper-modal.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background-color: transparent;
            border: none;
            width: 90vw;
            max-width: 500px;
            height: 70vh; height: 70dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: none;
        }

        .close-modal {
            position: absolute;
            top: -20px;
            right: 0px;
            background-color: #d96b52;
            color: #fff;
            border: 3px solid #1a1a1a;
            font-family: monospace;
            font-weight: bold;
            padding: 12px 16px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #1a1a1a;
            font-size: 0.85rem;
            z-index: 30;
        }

        .modal-image-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }

        .modal-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(8px 12px 0px rgba(26,26,26,0.15));
        }

        /* LÁBLÉC ÉS KAZETTÁS LEJÁTSZÓ */
        footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            border-top: 2px solid #1a1a1a;
            padding-top: 15px;
            margin-top: auto;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
            gap: 15px;
            flex-wrap: wrap;
        }

        .cassette-player {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.05);
            padding: 4px 10px;
            border: 1px solid #1a1a1a;
        }

        .cassette-btn {
            background: transparent;
            border: none;
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
            color: inherit;
        }
        .cassette-btn:hover { color: #d96b52; }

        /* ====================================================
           MOBIL TELEFONRA OPTIMALIZÁLT NÉZET (RESPONSIVE)
           ==================================================== */
        @media (max-width: 768px) {
            body { padding: 18px 14px; }

            header {
                margin-bottom: 25px;
                padding-bottom: 12px;
                border-bottom: 3px solid #1a1a1a;
                align-items: center;
            }

            .back-link { font-size: 0.85rem; white-space: nowrap; }

            h1 { font-size: 1.25rem; letter-spacing: -1px; text-align: right; }

            .clipper-grid {
                grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
                gap: 25px 12px;
                padding: 10px 0;
            }

            .clipper-image-holder { height: 170px; }

            .zippo-cabinet { gap: 45px; padding: 10px 0; margin: 15px auto; }

            /* 3 oszlop: nagyobb, jobban koppintható zippók */
            .zippo-shelf {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 26px 10px;
                padding-bottom: 15px;
                transform: none !important;
            }

            #shelf-1 { border-bottom: 5px solid #4a6b82; }
            #shelf-2 { border-bottom: 5px solid #d96b52; }
            #shelf-3 { border-bottom: 5px solid #e5b869; }

            .zippo-shelf::after { bottom: -9px; height: 4px; }

            .zippo-item { min-height: 150px; }

            .zippo-img-holder { max-width: 92px; }

            .zippo-label { font-size: 0.65rem; margin-top: 8px; letter-spacing: 0; }

            footer {
                font-size: 0.7rem;
                flex-direction: column;
                gap: 12px;
                text-align: center;
                padding-top: 15px;
            }
        }
    </style>
</head>
<body ondblclick="toggleGlitch()">

    <div id="app-wrapper">
        <header>
            <a href="index.html" class="back-link" id="header-back-btn">← [ vissza ]</a>
            <h1 id="header-title">03 // Gyújtók</h1>
        </header>

        <div class="zippo-trigger-wrapper" id="zippo-gate">
            <div class="zippo-trigger-text" id="gate-text">Kattints a Zippóra a B-oldalhoz</div>
            <div class="zippo-lighter" id="interactive-zippo">
                <div class="zippo-chimney"></div>
                <div class="zippo-flame"></div>
                <div class="zippo-lid"></div>
                <div class="zippo-body"></div>
            </div>
        </div>

        <!-- A-OLDAL: CLIPPER SZEGMENS -->
        <div class="view-section active-view" id="clipper-section">
            <main class="clipper-grid" id="clipper-grid-container"></main>
        </div>

        <!-- B-OLDAL: ZIPPO SZEGMENS -->
        <div class="view-section" id="zippo-section">
            <div class="zippo-cabinet">
                <div class="zippo-shelf" id="shelf-1"></div>
                <div class="zippo-shelf" id="shelf-2"></div>
                <div class="zippo-shelf" id="shelf-3"></div>
            </div>
        </div>
    </div>

    <!-- MODÁLIS PANEL -->
    <div class="clipper-modal" id="info-modal">
        <div class="modal-card">
            <button class="close-modal" id="close-btn">X [ BEZÁR ]</button>
            <div class="modal-image-wrapper">
                <img src="" id="modal-img" alt="Zippo fókusz">
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-left" id="footer-left-text">
            // Nem dohányzom...
        </div>

        <div class="cassette-player">
            <button class="cassette-btn" id="playBtn" onclick="toggleAudio()">[ ▶ PLAY ]</button>
            <span id="trackName" style="font-size:0.7rem;">[ Random song ]</span>
            <audio id="audioEngine" loop></audio>
        </div>

        <div class="footer-right" id="timer">Jelenlét: 0 másodperc</div>
    </footer>

    <script>
        /* hover csak egérrel; telefonon ne ragadjon be koppintás után */
        document.documentElement.classList.toggle('can-hover', window.matchMedia('(hover: hover)').matches);

        /* kis WebP a rácsban, nagy a nagyításban; ha hiányzik, visszaesik az eredeti PNG-re */
        const thumb = f => /^https?:/.test(f) ? f : 'thumbs/' + f.replace(/\.png$/i, '.webp');
        const full = f => /^https?:/.test(f) ? f : 'full/' + f.replace(/\.png$/i, '.webp');

        function openModalImg(file) {
            const m = document.getElementById('modal-img');
            m.onerror = () => { m.onerror = null; m.src = file; };
            m.src = full(file);
        }

        document.addEventListener('error', e => {
            const i = e.target;
            if (i.tagName === 'IMG' && i.dataset.orig && !i.dataset.fb) { i.dataset.fb = '1'; i.src = i.dataset.orig; }
        }, true);

        // IMG_xxxx.PNG fájlok sorszámai (1. elem = #01, 2. elem = #02, ...)
        const clipperFiles = [
            2017, 2031, 2033, 2038, 2040, 2043, 2045, 2047, 2049, 2053,
            2055, 2057, 2059, 2062, 2063, 2065, 2067, 2069, 2071, 2073,
            2075, 2077, 2079, 2081, 2083, 2087, 2089, 2091, 2093, 2096,
            2098, 2100, 2104, 2106, 2108, 2110, 2112, 2114, 2116, 2119,
            2122, 2124, 2128, 2130, 2132, 2135, 2137, 2139, 2141, 2143,
            2145, 2147, 2149, 2151, 2153, 2155, 2157, 2159, 2161, 2163,
            2165, 2167, 2169, 2171, 2173
        ];

        const clipperGrid = document.getElementById('clipper-grid-container');
        const modal = document.getElementById('info-modal');
        const closeModal = document.getElementById('close-btn');

        if (clipperGrid) {
            clipperFiles.forEach((num, idx) => {
                const currentId = idx + 1 < 10 ? "0" + (idx + 1) : idx + 1;
                const itemImg = `IMG_${num}.PNG`;

                const card = document.createElement('div');
                card.className = 'clipper-item';

                const randomRotate = (Math.random() * 12 - 6).toFixed(2);
                const randomY = (Math.random() * 10 - 5).toFixed(2);
                card.style.transform = `rotate(${randomRotate}deg) translateY(${randomY}px)`;

                card.innerHTML = `
                    <div class="clipper-image-holder">
                        <img src="${thumb(itemImg)}" data-orig="${itemImg}" alt="Clipper #${currentId}" loading="lazy" decoding="async">
                    </div>
                    <div class="clipper-label">#${currentId}</div>
                `;

                card.addEventListener('click', () => {
                    openModalImg(itemImg);
                    modal.classList.add('active');
                });
                clipperGrid.appendChild(card);
            });
        }

        // ZIPPO POLCOK (5 elem soronként - reszponzív)
        for (let i = 1; i <= 15; i++) {
            let id = i < 10 ? "0" + i : i;
            let targetShelf = i <= 5 ? document.getElementById('shelf-1') : (i <= 10 ? document.getElementById('shelf-2') : document.getElementById('shelf-3'));

            if (targetShelf) {
                const zItem = document.createElement('div');
                zItem.className = 'zippo-item';

                const randomRotate = (Math.random() * 6 - 3).toFixed(2);
                zItem.style.transform = `rotate(${randomRotate}deg)`;

                zItem.innerHTML = `
                    <div class="zippo-img-holder">
                        <img src="${thumb('zippo_' + id + '.PNG')}" data-orig="zippo_${id}.PNG" alt="Zippo #${id}" loading="lazy" decoding="async">
                    </div>
                    <div class="zippo-label">#z_${id}</div>
                `;

                zItem.addEventListener('click', () => {
                    openModalImg(`zippo_${id}o.PNG`);
                    modal.classList.add('active');
                });
                targetShelf.appendChild(zItem);
            }
        }

        /* FOLYAMATOS JELENLÉT MÉRŐ */
        let seconds = sessionStorage.getItem('aedoner_presence');
        seconds = seconds === null ? 0 : parseInt(seconds, 10);

        setInterval(() => {
            seconds++;
            sessionStorage.setItem('aedoner_presence', seconds);
            const timerEl = document.getElementById('timer');
            if (timerEl) timerEl.innerText = "Jelenlét: " + seconds + " másodperc";
        }, 1000);

        document.getElementById('timer').innerText = "Jelenlét: " + seconds + " másodperc";

        const zippoKey = document.getElementById('interactive-zippo');
        const clipperSection = document.getElementById('clipper-section');
        const zippoSection = document.getElementById('zippo-section');
        const headerTitle = document.getElementById('header-title');
        const footerLeft = document.getElementById('footer-left-text');
        const gateText = document.getElementById('gate-text');
        const headerBackBtn = document.getElementById('header-back-btn');

        let isZippoView = false;

        if (zippoKey) {
            zippoKey.addEventListener('click', () => {
                if (isZippoView) return;
                isZippoView = true;
                gateText.innerText = "LOBBANÁS...";

                setTimeout(() => { zippoKey.classList.add('open-1'); }, 100);
                setTimeout(() => { zippoKey.classList.add('open-2'); }, 450);
                setTimeout(() => { zippoKey.classList.add('open-3'); }, 750);

                setTimeout(() => {
                    clipperSection.classList.remove('active-view');
                    zippoSection.classList.add('active-view');
                    headerTitle.innerText = "04 // Zippo Archívum";
                    footerLeft.innerText = "// Még mindig nem...";
                    zippoKey.className = "zippo-lighter";
                    document.getElementById('zippo-gate').style.display = 'none';
                    headerBackBtn.href = "#";
                    headerBackBtn.innerText = "← [ clipperek ]";
                }, 1500);
            });
        }

        if (headerBackBtn) {
            headerBackBtn.addEventListener('click', (e) => {
                if (isZippoView) {
                    e.preventDefault();
                    isZippoView = false;
                    zippoSection.classList.remove('active-view');
                    clipperSection.classList.add('active-view');
                    headerTitle.innerText = "03 // Gyújtók";
                    footerLeft.innerText = "// Nem dohányzom...";
                    document.getElementById('zippo-gate').style.display = 'flex';
                    gateText.innerText = "Kattints a Zippóra a B-oldalhoz";
                    headerBackBtn.href = "index.html";
                    headerBackBtn.innerText = "← [ vissza ]";
                }
            });
        }

        if (closeModal) closeModal.addEventListener('click', () => modal.classList.remove('active'));
        if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        /* KAZETTÁS MAGNÓ RANDOM ENGINE */
        const audio = document.getElementById('audioEngine') || document.createElement('audio');
        if (!audio.id) { audio.id = 'audioEngine'; audio.loop = true; document.body.appendChild(audio); }

        const playBtn = document.getElementById('playBtn');
        const trackNameEl = document.getElementById('trackName');

        const playlist = [
            { title: "hegyek.mp3", src: "Dallamok/hegyek.mp3" },
            { title: "A_babam_fekete_romalany.mp3", src: "Dallamok/A_babam_fekete_romalany.mp3" },
            { title: "littlepaul.wav", src: "Dallamok/littlepaul.wav" },
            { title: "makaralexneknagya.mp3", src: "Dallamok/makaralexneknagya.mp3" }
        ];

        function toggleAudio() {
            if (audio.paused) {
                if (!audio.src || audio.src === "" || audio.ended) {
                    const randomIndex = Math.floor(Math.random() * playlist.length);
                    const randomTrack = playlist[randomIndex];
                    audio.src = randomTrack.src;
                    if (trackNameEl) trackNameEl.innerText = randomTrack.title;
                }

                audio.play();
                playBtn.innerText = '[ ❚❚ PAUSE ]';
            } else {
                audio.pause();
                playBtn.innerText = '[ ▶ PLAY ]';
            }
        }

        function toggleGlitch() {
            document.body.classList.toggle('glitch-mode');
        }

        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleGlitch();
            }
        });
    </script>
</body>
</html>
