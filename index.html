<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aedoner // absolute collage</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: #f1f0ec;
            color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.04;
            pointer-events: none;
            z-index: 999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .brand {
            position: fixed;
            top: 40px;
            left: 40px;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            z-index: 10;
        }

        /* Központi tároló */
        .collage-container {
            width: 85vw;
            height: 65vh;
            display: flex;
            border: 4px solid #1a1a1a;
            background-color: #1a1a1a;
            gap: 4px;
            box-shadow: 20px 20px 0px rgba(26, 26, 26, 0.08);
            overflow: hidden;
            margin: auto 0;
        }

        .block {
            flex: 1;
            text-decoration: none;
            color: #1a1a1a;
            position: relative;
            transition: flex 0.8s cubic-bezier(0.25, 1, 0.3, 1), background-color 0.5s;
            cursor: pointer;
        }

        .block-content {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 40px 40px 60px;
            z-index: 5;
        }

        .block-visual {
            background-color: #d96b52;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
        }

        .block-audio {
            background-color: #4a6b82;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
        }

        .block-audio .block-content {
            padding-left: 85px;
        }

        .block-text {
            background-color: #e5b869;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 15% 100%);
        }

        .block-text .block-content {
            padding-left: 95px; /* Kicsit nagyobb hely a Gondola(t) feliratnak */
        }

        /* Hover hatás */
        .collage-container .block:hover {
            flex: 3;
            color: #fff;
            background-color: #111;
            clip-path: none;
        }

        .collage-container .block:hover .block-content {
            padding-left: 40px;
        }

        /* Szövegformázások */
        .block .num {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            opacity: 0.5;
            transition: color 0.3s;
        }

        .block h2 {
            font-size: clamp(1.5rem, 4vw, 3.5rem);
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 0.9;
            margin-top: auto;
            margin-bottom: 20px;
            transition: transform 0.4s, color 0.3s;
        }

        .block p {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            opacity: 0.7;
            border-top: 1px solid rgba(26, 26, 26, 0.2);
            padding-top: 15px;
            transition: color 0.3s, border-color 0.3s;
        }

        .block:hover .num,
        .block:hover h2,
        .block:hover p {
            color: #fff;
            opacity: 1;
        }

        .block:hover p {
            border-top-color: rgba(255, 255, 255, 0.3);
        }

        .block:hover h2 {
            transform: translateY(-5px);
        }

        /* gatya */
        footer {
            width: 85vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            border-top: 2px solid #1a1a1a;
            padding-top: 15px;
            z-index: 10;
        }

        .footer-left {
            letter-spacing: 1px;
        }

        .footer-right {
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="brand">aedoner</div>

    <div class="collage-container">
        
        <!-- 01 Vizuál -->
        <a href="vizual.html" class="block block-visual">
            <div class="block-content">
                <span class="num">01 //</span>
                <div>
                    <h2>Vizuál</h2>
                    <p>Sketchbook . Digital Art . Fotó</p>
                </div>
            </div>
        </a>

        <!-- 02 Dallamsorok -->
        <a href="dallamok.html" class="block block-audio">
            <div class="block-content">
                <span class="num">02 //</span>
                <div>
                    <h2>Dallamsorok</h2>
                    <p>Akusztikus . Demó</p>
                </div>
            </div>
        </a>

        <!-- 03 Gondola(t) -->
        <a href="gondolat.html" class="block block-text">
            <div class="block-content">
                <span class="num">03 //</span>
                <div>
                    <h2>Gondola(t)</h2>
                    <p>Haiku</p>
                </div>
            </div>
        </a>

    </div>

    <!-- Lábléc -->
    <footer>
        <div class="footer-left">aedoner.hu // Jasper megy az idő.</div>
        <div class="footer-right" id="timer">Jelenlét: 0 másodperc</div>
    </footer>

    <script>
        // Számláló
        let seconds = 0;
        setInterval(() => {
            seconds++;
            document.getElementById('timer').innerText = "Jelenlét: " + seconds + " másodperc";
        }, 1000);
    </script>
</body>
</html>
