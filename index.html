<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aedoner // csend</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a; /* Teljes sötétség */
            color: #edebe6;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .maintenance-box {
            border: 3px solid #edebe6;
            padding: 40px;
            max-width: 500px;
            box-shadow: 15px 15px 0px #e5b869; /* Okkersárga kubista árnyék */
        }
        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 15px;
        }
        p {
            font-size: 0.9rem;
            text-transform: uppercase;
            opacity: 0.7;
            letter-spacing: 1px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="maintenance-box">
        <h1> Aedoner </h1>
        <p>A struktúra átalakítás alatt. <br> A sorok és a szilánkok hamarosan összeállnak.</p>
    </div>

</body>
</html>
